name: Build and test

on:
  push:
    branches: [codex/render-free]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Build lossless artifacts and run tests
        run: npm test
      - name: Verify server data equals original source
        run: npm run verify:hitboxes
